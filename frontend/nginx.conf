server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 105m;
    location /api/ {
        proxy_pass http://workbench-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
