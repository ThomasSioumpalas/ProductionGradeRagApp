services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  rag-app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - INNGEST_EVENT_KEY=any_key_for_local_dev
      - INNGEST_BASE_URL=http://inngest:8288
      - INNGEST_DEV=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - HF_HOME=/cache/huggingface
    depends_on:
      - qdrant
    volumes:
      - .:/app
      - ./documents:/app/documents
      - hf_cache:/cache/huggingface
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  inngest:
    image: inngest/inngest:latest
    container_name: inngest-server
    ports:
      - "8288:8288"
    depends_on:
      rag-app:
        condition: service_healthy
    command: ["inngest", "dev", "-u", "http://rag-app:8000/api/inngest"]

volumes:
  qdrant_storage:
  hf_cache: