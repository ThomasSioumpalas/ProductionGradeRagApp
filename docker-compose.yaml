services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  inngest:
    image: inngest/inngest:latest
    container_name: inngest-server
    ports:
      - "8288:8288"
    command: ["inngest", "dev", "-u", "http://rag-app:8000/api/inngest"]

  rag-app:
    build: .
    container_name: financial-ai-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - INNGEST_EVENT_KEY=any_key_for_local_dev
      - INNGEST_URL=http://inngest:8288
    depends_on:
      - qdrant
      - inngest
    volumes:
      - .:/app

volumes:
  qdrant_storage: