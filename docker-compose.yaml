services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  rag-app:
    build: .
    container_name: financial-ai-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - INNGEST_EVENT_KEY=any_key_for_local_dev
      - INNGEST_DEV=1  # Required for local Inngest development
    depends_on:
      - qdrant
    volumes:
      - .:/app
      # CRITICAL: Maps your local PDF folder into the container
      - ./documents:/app/documents 
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s # Gives BGE-M3 model time to download

  inngest:
    image: inngest/inngest:latest
    container_name: inngest-server
    ports:
      - "8288:8288"
    depends_on:
      rag-app:
        condition: service_healthy
    command: ["inngest", "dev", "-u", "http://rag-app:8000/api/inngest"]

volumes:
  qdrant_storage: